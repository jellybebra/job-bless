<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}job-bless{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ static_version }}">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="{{ 'with-console' if path == '/actions' }}">
<header class="topbar">
  <a class="brand" href="/">job<span>-bless</span></a>
  <nav>
    <a href="/" class="{{ 'active' if path == '/' }}">Обзор</a>
    <a href="/actions" class="{{ 'active' if path == '/actions' }}">Действия</a>
    <a href="/vacancies" class="{{ 'active' if path == '/vacancies' }}">Вакансии</a>
    <a href="/applications" class="{{ 'active' if path == '/applications' }}">Отклики</a>
    <a href="/resume" class="{{ 'active' if path == '/resume' }}">Резюме</a>
    <a href="/runs" class="{{ 'active' if path == '/runs' }}">Прогоны</a>
    <a href="/settings" class="{{ 'active' if path == '/settings' }}">Настройки</a>
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

{% if path == "/actions" %}
<section class="console" id="console-block">
  <div class="console-resize" id="console-resize" role="separator" tabindex="0"
       aria-label="Высота журнала" aria-orientation="horizontal" aria-controls="log"
       aria-valuemin="120" aria-valuemax="600" aria-valuenow="200"
       title="Потяните вверх или вниз, чтобы изменить высоту журнала"></div>
  <div class="console-head">
    <span>Журнал текущей задачи</span>
    <div class="console-actions">
      <button type="button" class="link" onclick="document.getElementById('log').textContent=''">Очистить</button>
      <button type="button" class="link" id="console-toggle" aria-expanded="true" aria-controls="log">Свернуть</button>
    </div>
  </div>
  <pre id="log">{% if current_task %}{{ current_task.logs | join('\n') }}{% endif %}</pre>
</section>
{% endif %}

<script src="/static/app.js?v={{ static_version }}" defer></script>
</body>
</html>
