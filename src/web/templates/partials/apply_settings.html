{% from 'partials/action_settings.html' import render_sections %}
<form class="apply-settings-form" method="post" action="/actions/apply-settings" hx-post="/actions/apply-settings" hx-target="#apply-dialog-content"
      hx-swap="innerHTML" hx-disabled-elt="find button[type='submit']" hx-disinherit="hx-disabled-elt">
  <p class="muted">Настройки действуют и при отдельном запуске, и в последовательности действий.</p>
  <div class="error-box" id="apply-save-error" role="alert" {{ 'hidden' if not errors }}>
    {% for error in errors %}<p>{{ error }}</p>{% endfor %}
  </div>
  {{ render_sections(sections) }}
  <div class="dialog-actions">
    <button type="button" data-close-apply>Отмена</button>
    <button type="submit" class="primary">Сохранить</button>
  </div>
</form>
